                <path d="M561 181q10-31 41-35" fill="none" stroke="#ffe59a" stroke-width="9"/>
                <path d="M608 138q31 13 32 57" fill="none" stroke="#e9a743" stroke-width="7"/>
                <path d="m585 160 9-3m28-5 8 6m-66 18 9-6" fill="none" stroke="#9b804c" stroke-width="5"/>
                <path d="M548 201q16-14 37-14 28 9 52 4l39-9q12-1 20 7-6 12-27 16l-35 4q-26 0-48-9-17-3-28 10-8 2-10-9Z" fill="#ffda80" stroke="#38575d" stroke-width="4"/>
                <path d="m557 200 12-7m93-3 14-4" stroke="#fff0b6" stroke-width="4"/>
              </g>
            </g>
            <g id="ribbons" fill="none" stroke-width="4"><path id="ribbon-one" d="M722 316q20 11 32 3" stroke="#ee9b95"/><path id="ribbon-two" d="M722 318q14 20 27 13" stroke="#eabc60"/><path id="ribbon-three" d="M722 320q14 8 25 3" stroke="#83bfc4"/></g>
            <path id="breeze" d="M371 286h-27m32 15h-43m-1-15h-8" fill="none" stroke="#9bc7c9" stroke-width="3"/>
          </g>
          <path d="M-400 633q224-16 450 3t460 0 455 0 455-2 455 0v70H-400Z" fill="#78b593"/>
          <path d="M-400 637q224-16 450 3t460 0 455 0 455-2 455 0" fill="none" stroke="#91c7a1" stroke-width="5"/>
          <g id="foreground"><g id="foreground-tile"><use href="#flower" xlink:href="#flower" transform="translate(128 632) scale(1.04)"/><use href="#flower" xlink:href="#flower" transform="translate(151 647) scale(.66)"/><use href="#grass" xlink:href="#grass" transform="translate(364 660) scale(1.2)"/><use href="#flower" xlink:href="#flower" transform="translate(913 643) scale(.84)"/><use href="#grass" xlink:href="#grass" transform="translate(1058 670) scale(1.3)"/></g><use href="#foreground-tile" xlink:href="#foreground-tile" x="-1320"/><use href="#foreground-tile" xlink:href="#foreground-tile" x="1320"/><use href="#foreground-tile" xlink:href="#foreground-tile" x="2640"/></g>
        </g>
      </svg>
    </div>
    <div class="controls-area">
      <div class="controls" role="group" aria-label="动画播放控制">
        <button class="play-button" id="play-button" type="button" aria-label="暂停动画" aria-pressed="false"><svg id="pause-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="3.5"/></svg><svg id="play-icon" aria-hidden="true" viewBox="0 0 24 24" hidden><path d="m8 5 11 7-11 7Z" fill="currentColor" stroke="none"/></svg><span id="play-label">暂停</span></button>
        <div class="speed-group" role="group" aria-label="骑行速度"><button class="speed-button" type="button" data-speed="0.6" aria-pressed="false" aria-label="慢速，0.6 倍">慢速</button><button class="speed-button" type="button" data-speed="1" aria-pressed="true" aria-label="正常，1 倍">正常</button><button class="speed-button" type="button" data-speed="1.6" aria-pressed="false" aria-label="快骑，1.6 倍">快骑</button></div>
        <span class="divider" aria-hidden="true"></span>
        <button class="fullscreen-button" id="fullscreen-button" type="button" aria-label="全屏观看" aria-pressed="false" title="全屏观看"><svg aria-hidden="true" viewBox="0 0 24 24"><path id="fullscreen-icon" d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
      </div>
      <p class="caption" id="caption" aria-live="polite">小脚蹬一蹬，快乐向前走。</p>
    </div>
    <noscript><p style="text-align:center;padding:16px">开启浏览器的 JavaScript，即可播放骑行动画。</p></noscript>
  </main>
</div>
<script>
(() => {
  'use strict';
  const byId = (id) => document.getElementById(id);
  const app = byId('app');
  const scene = byId('scene');
  const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
  const mobileQuery = window.matchMedia('(max-width: 640px)');
  const playButton = byId('play-button');
  const speedButtons = Array.from(document.querySelectorAll('[data-speed]'));
  const fullButton = byId('fullscreen-button');
  const nodes = Object.fromEntries(['rear-spokes','front-spokes','rider-rig','bike-shadow','far-hills','near-hills','clouds','trees','roadside','foreground','baby-eyes','baby-head','birds','ribbon-one','ribbon-two','ribbon-three','breeze'].map(id => [id, byId(id)]));
  const roadLines = byId('road-lines');
  const roadGrain = byId('road-grain');
  const legNodes = Object.fromEntries(['far','near'].map(side => [side, Object.fromEntries(['leg-outline','leg-skin','shorts','shoe','crank','pedal'].map(name => [name,byId(side+'-'+name)]))]));
  const crankShine = byId('near-crank-shine');
  const TAU = Math.PI * 2;
  let playing = !motionPreference.matches;
  let speed = 1;
  let elapsed = 0;
  let previous = null;
  let requestId = null;
  let fallbackFullscreen = false;

  const set = (node, name, value) => node.setAttribute(name, String(value));
  function fitScene(){
    // Crop empty sides on portrait phones instead of shrinking the rider.
    set(scene,'viewBox',mobileQuery.matches ? '285 95 640 585' : '0 0 1200 680');
  }

  function poseLeg(side, angle) {
    const n = legNodes[side];
    const hip = { x: 574, y: 357 };
    const pedal = { x: 588 + Math.cos(angle)*31, y: 467 + Math.sin(angle)*31 };
    const ankle = { x: pedal.x - 1, y: pedal.y - 11 };
    const dx = ankle.x - hip.x, dy = ankle.y - hip.y;
    const distance = Math.hypot(dx,dy);
    const upper = 72, lower = 80;
    const along = (upper*upper - lower*lower + distance*distance) / (2*distance);
    const height = Math.sqrt(Math.max(0,upper*upper-along*along));
    const knee = {x: hip.x+dx*along/distance+dy*height/distance,y:hip.y+dy*along/distance-dx*height/distance};
    const path = `M${hip.x} ${hip.y}L${knee.x.toFixed(2)} ${knee.y.toFixed(2)}L${ankle.x.toFixed(2)} ${ankle.y.toFixed(2)}`;
    set(n['leg-outline'],'d',path);
    set(n['leg-skin'],'d',path);
    set(n.shorts,'d',`M${hip.x} ${hip.y}L${(hip.x+(knee.x-hip.x)*.63).toFixed(2)} ${(hip.y+(knee.y-hip.y)*.63).toFixed(2)}`);
    set(n.shoe,'transform',`translate(${ankle.x.toFixed(2)} ${ankle.y.toFixed(2)})`);
    const crank = `M588 467L${pedal.x.toFixed(2)} ${pedal.y.toFixed(2)}`;
    set(n.crank,'d',crank);
    if(side==='near') set(crankShine,'d',crank);
    set(n.pedal,'d',`M${(pedal.x-16).toFixed(2)} ${pedal.y.toFixed(2)}h32`);
  }

  function render(t) {
    const pedalAngle = t * TAU / 1.7 + .7;
    const wheelAngle = t * 210;
    const travel = t * 330;
    const bob = Math.sin(pedalAngle*2) * 1.35;
    set(nodes['rear-spokes'],'transform',`rotate(${wheelAngle%360})`);
    set(nodes['front-spokes'],'transform',`rotate(${wheelAngle%360})`);
    set(nodes['rider-rig'],'transform',`translate(0 ${bob.toFixed(2)})`);
    set(nodes['bike-shadow'],'rx',210 + bob*.8);
    poseLeg('far',pedalAngle + Math.PI);
    poseLeg('near',pedalAngle);
    set(nodes['far-hills'],'transform',`translate(${-((travel*.06)%1200)} 0)`);
    set(nodes['near-hills'],'transform',`translate(${-((travel*.12)%1200)} 0)`);
    set(nodes.clouds,'transform',`translate(${-((travel*.07)%1200)} 0)`);
    set(nodes.trees,'transform',`translate(${-((travel*.38)%1320)} 0)`);
    set(nodes.roadside,'transform',`translate(${-((travel*.78)%1320)} 0)`);
    set(nodes.foreground,'transform',`translate(${-((travel*1.08)%1320)} 0)`);
    set(roadLines,'patternTransform',`translate(${-travel%180} 0)`);
    set(roadGrain,'patternTransform',`translate(${-travel%83} 0)`);
    const blink = t % 4.7;
    const eyeScale = blink > 4.43 && blink < 4.59 ? .12 : 1;
    set(nodes['baby-eyes'],'transform',`translate(0 ${233*(1-eyeScale)}) scale(1 ${eyeScale})`);
    set(nodes['baby-head'],'transform',`rotate(${(Math.sin(pedalAngle)*.65).toFixed(2)} 613 279)`);
    set(nodes.birds,'transform',`translate(${Math.sin(t*.3)*16} ${Math.sin(t*1.8)*3})`);
    set(nodes['ribbon-one'],'d',`M722 316q19 ${-6+Math.sin(t*8)*5} 32 ${-13+Math.sin(t*8+1)*4}`);
    set(nodes['ribbon-two'],'d',`M722 318q17 ${4+Math.sin(t*8+2)*4} 30 ${-3+Math.sin(t*8+3)*5}`);
    set(nodes['ribbon-three'],'d',`M722 320q16 ${10+Math.sin(t*8+4)*4} 25 ${3+Math.sin(t*8+5)*4}`);
    set(nodes.breeze,'opacity',.45+Math.sin(t*3)*.2);
  }

  function frame(now) {
    requestId = null;
    if(!playing || document.hidden) { previous = null; return; }
    if(previous !== null) elapsed += Math.min((now-previous)/1000,.05)*speed;
    previous = now;
    render(elapsed);
    requestId = window.requestAnimationFrame(frame);
  }
  function schedule(){ if(playing && !document.hidden && requestId===null) requestId=window.requestAnimationFrame(frame); }
  function updatePlay(){
    byId('pause-icon').hidden = !playing;
    byId('play-icon').hidden = playing;
    // SVG hidden is not implemented uniformly, so also set the attribute explicitly.
    byId('pause-icon').toggleAttribute('hidden',!playing);
    byId('play-icon').toggleAttribute('hidden',playing);
    byId('play-label').textContent = playing ? '暂停' : '播放';
    set(playButton,'aria-label',playing ? '暂停动画' : '播放动画');
    set(playButton,'aria-pressed',!playing);
  }
  function setPlaying(value){
    playing=value;
    previous=null;
    if(!playing && requestId!==null){ window.cancelAnimationFrame(requestId); requestId=null; }
    updatePlay();
    byId('caption').textContent=playing ? '小脚蹬一蹬，快乐向前走。' : '歇一歇，等你一起出发。';
    schedule();
  }
  playButton.addEventListener('click',()=>setPlaying(!playing));
  speedButtons.forEach(button=>button.addEventListener('click',()=>{
    speed=Number(button.dataset.speed);
    speedButtons.forEach(item=>set(item,'aria-pressed',item===button));
  }));
  document.addEventListener('visibilitychange',()=>{
    previous=null;
    if(document.hidden && requestId!==null){window.cancelAnimationFrame(requestId);requestId=null;}
    else schedule();
  });
  document.addEventListener('keydown',event=>{
    if(event.code==='Space' && (event.target===document.body || event.target===app)){
      event.preventDefault();setPlaying(!playing);
    }
    if(event.key==='Escape' && fallbackFullscreen) setFallback(false);
  });

  function updateFullscreen(){
    const active=!!document.fullscreenElement || fallbackFullscreen;
    set(fullButton,'aria-label',active?'退出全屏':'全屏观看');
    set(fullButton,'aria-pressed',active);
    fullButton.title=active?'退出全屏':'全屏观看';
    set(byId('fullscreen-icon'),'d',active?'M3 8h5V3m8 0v5h5M8 21v-5H3m18 0h-5v5':'M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5');
  }
  function setFallback(value){
    fallbackFullscreen=value;
    app.classList.toggle('immersive',value);
    document.body.style.overflow=value?'hidden':'';
    updateFullscreen();
  }
  fullButton.addEventListener('click',async()=>{
    if(fallbackFullscreen){setFallback(false);return;}
    try{
      if(document.fullscreenElement) await document.exitFullscreen();
      else if(app.requestFullscreen) await app.requestFullscreen();
      else setFallback(true);
    }catch{setFallback(true);}
    updateFullscreen();
  });
  document.addEventListener('fullscreenchange',updateFullscreen);
  function listen(query,callback){if(query.addEventListener) query.addEventListener('change',callback);else query.addListener(callback);}
  listen(mobileQuery,fitScene);
  listen(motionPreference,event=>{if(event.matches) setPlaying(false);});
  fitScene();render(0);updatePlay();
  if(!playing) byId('caption').textContent='已按你的减少动态效果设置暂停，点击播放即可出发。';
  schedule();
})();
</script>
</body>
