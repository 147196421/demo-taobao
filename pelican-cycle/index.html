<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e5f1f3">
  <title>鹈鹕骑行记 · SVG 2D 动画</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #284c59;
      --muted: #56747b;
      --page: #e5f1f3;
      --accent: #d65349;
      --line: #bdd5d8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 280px;
      min-height: 100svh;
      background: var(--page);
      color: var(--ink);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { width: min(1120px, 100%); margin: 0 auto; padding: 38px 30px 24px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin: 0 2px 22px; }
    h1 { margin: 0; font-size: clamp(24px, 3vw, 32px); font-weight: 700; letter-spacing: .06em; }
    header p { margin: 0; font-size: 14px; letter-spacing: .12em; color: var(--muted); }
    .viewport {
      position: relative;
      aspect-ratio: 1200 / 690;
      overflow: hidden;
      border-radius: 24px;
      background: #d6eef2;
      isolation: isolate;
    }
    .scene { display: block; width: 100%; height: 100%; }
    .controls { display: flex; align-items: center; gap: 25px; padding: 22px 2px 0; }
    button {
      display: inline-flex;
      gap: 9px;
      align-items: center;
      justify-content: center;
      min-width: 109px;
      min-height: 44px;
      padding: 10px 19px;
      border: 0;
      border-radius: 30px;
      background: var(--ink);
      color: #fff;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s;
    }
    button:hover { background: #376373; }
    button svg { width: 16px; height: 16px; flex: none; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
    .speed { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
    .speed label { white-space: nowrap; }
    input[type="range"] { width: 126px; height: 36px; margin: 0; accent-color: var(--accent); cursor: pointer; }
    output { min-width: 38px; font-variant-numeric: tabular-nums; color: var(--ink); }
    .mood { display: flex; align-items: center; gap: 8px; margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; }
    .mood svg { width: 30px; height: 20px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    noscript { display: block; margin-top: 16px; font-size: 14px; color: var(--muted); }
    @media (max-width: 640px) {
      main { padding: 26px 16px 20px; }
      header { display: block; margin-bottom: 19px; }
      header p { margin-top: 8px; font-size: 12px; }
      .viewport { aspect-ratio: 1.13; border-radius: 20px; }
      .controls { gap: 16px; flex-wrap: wrap; padding-top: 18px; }
      .speed { flex: 1; gap: 9px; }
      input[type="range"] { flex: 1; width: 85px; min-width: 48px; }
      .mood { width: 100%; justify-content: center; margin-top: 1px; }
      button { min-width: 96px; padding: 10px 14px; }
    }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>

  <script>
    (() => {
      'use strict';
      const byId = id => document.getElementById(id);
      const nodes = Object.fromEntries([
        'clouds', 'dunes', 'landmarks', 'waves', 'shore', 'road', 'rear-spokes',
        'front-spokes', 'far-crank', 'near-crank', 'near-crank-outline', 'gear-detail',
        'chain', 'far-leg-outline', 'far-leg-color', 'near-leg-outline', 'near-leg-color',
        'far-foot', 'near-foot', 'pelican', 'eye', 'scarf-tail', 'scarf-tail-back',
        'wing', 'wing-feathers', 'breeze', 'bike-shadow', 'gull-one', 'gull-two'
      ].map(id => [id, byId(id)]));

      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      let playing = !motionPreference.matches;
      let speed = 1;
      let elapsed = 0;
      let previous = null;
      let frameId = null;
      const TAU = Math.PI * 2;
      const CADENCE = TAU / 1.8;
      const GEAR_RATIO = 1.18;
      const WHEEL_RADIUS = 94.5; // Outer radius includes half the tire stroke.
      const CRANK = { x: 546, y: 490, radius: 35 };
      const round = number => Number(number.toFixed(3));
      const attr = (name, attribute, value) => nodes[name].setAttribute(attribute, value);
      const path = (name, value) => attr(name, 'd', value);
      const scroll = (name, distance, width) => attr(name, 'transform', `translate(${-round(distance % width)} 0)`);

      // Two-segment inverse kinematics keeps each webbed foot on its pedal.
      // Both solutions bend the knee toward the handlebar.
      function leg(hipX, hipY, pedalX, pedalY, prefix) {
        const ankleX = pedalX - 12;
        const ankleY = pedalY - 15;
        const upper = 96, lower = 99;
        const dx = ankleX - hipX, dy = ankleY - hipY;
        const distance = Math.min(Math.hypot(dx, dy), upper + lower - .001);
        const direction = Math.atan2(dy, dx);
        const bend = Math.acos(Math.max(-1, Math.min(1,
          (upper * upper + distance * distance - lower * lower) / (2 * upper * distance))));
        const kneeX = hipX + Math.cos(direction - bend) * upper;
        const kneeY = hipY + Math.sin(direction - bend) * upper;
        const d = `M${round(hipX)} ${round(hipY)} L${round(kneeX)} ${round(kneeY)} L${round(ankleX)} ${round(ankleY)}`;
        path(`${prefix}-leg-outline`, d);
        path(`${prefix}-leg-color`, d);
        attr(`${prefix}-foot`, 'transform', `translate(${round(pedalX)} ${round(pedalY - 5)})`);
      }

      function draw(t) {
        const phase = t * CADENCE + .2;
        const cycleX = Math.cos(phase) * CRANK.radius;
        const cycleY = Math.sin(phase) * CRANK.radius;
        const nearX = CRANK.x + cycleX, nearY = CRANK.y + cycleY;
        const farX = CRANK.x - cycleX, farY = CRANK.y - cycleY;
        const wheelAngle = t * CADENCE * GEAR_RATIO;
        const distance = wheelAngle * WHEEL_RADIUS;
        const bob = Math.sin(phase * 2) * 2.2;
        const degrees = round(wheelAngle * 180 / Math.PI % 360);

        attr('rear-spokes', 'transform', `rotate(${degrees})`);
        attr('front-spokes', 'transform', `rotate(${degrees})`);
        attr('gear-detail', 'transform', `rotate(${round(phase * 180 / Math.PI % 360)} 546 490)`);
        attr('chain', 'stroke-dashoffset', round(-t * CADENCE * 25 % 8));
        path('far-crank', `M546 490 L${round(farX)} ${round(farY)}`);
        path('near-crank', `M546 490 L${round(nearX)} ${round(nearY)}`);
        path('near-crank-outline', `M546 490 L${round(nearX)} ${round(nearY)}`);
        leg(503, 342 + bob, farX, farY, 'far');
        leg(486, 346 + bob, nearX, nearY, 'near');

        attr('pelican', 'transform', `translate(0 ${round(bob)})`);
        // Cancel the body bob at the wingtip so it stays on the handlebar.
        path('wing', `M480 258 C511 247 538 269 558 283 C581 299 605 298 632 ${round(294 - bob * .5)} Q676 ${round(280 - bob)} 709 ${round(297 - bob)} Q723 ${round(304 - bob)} 711 ${round(314 - bob)} L692 ${round(314 - bob)} Q661 ${round(304 - bob)} 635 319 C586 341 543 324 516 307 Q488 290 480 258Z`);
        path('wing-feathers', `M507 274 Q547 310 581 314 M522 271 Q554 300 585 306 M637 ${round(305 - bob * .5)} Q674 ${round(293 - bob)} 704 ${round(304 - bob)}`);
        const flutter = Math.sin(t * 7.5) * 7;
        const ripple = Math.cos(t * 6.2) * 4;
        path('scarf-tail', `M579 222 Q537 ${round(203 + ripple)} 495 ${round(225 + flutter)} L459 ${round(214 + flutter)} L474 ${round(240 + flutter)} Q524 ${round(249 + ripple)} 580 236Z`);
        path('scarf-tail-back', `M583 215 Q549 ${round(188 - ripple)} 513 ${round(206 - flutter * .6)} L469 ${round(189 - flutter * .6)} L483 ${round(218 - flutter * .6)} Q528 ${round(238 - ripple)} 574 232Z`);
        const blinkPhase = t % 4.8;
        const blink = blinkPhase > 4.56 ? Math.max(.08, Math.abs((blinkPhase - 4.68) / .12)) : 1;
        attr('eye', 'transform', `translate(622 151) scale(1 ${round(blink)})`);
        attr('bike-shadow', 'rx', round(263 - bob));

        // Repeating scenery scrolls at different depths; the road obeys wheel travel.
        scroll('road', distance, 648);
        scroll('shore', distance * .46, 600);
        scroll('waves', distance * .08, 1200);
        scroll('dunes', distance * .023, 1200);
        scroll('landmarks', distance * .032, 1440);
        scroll('clouds', t * 5, 1440);
        attr('breeze', 'transform', `translate(${round(-Math.sin(t * 3) * 7)} 0)`);
        attr('breeze', 'opacity', round(.42 + Math.sin(t * 3) * .15));
        const flap = Math.sin(t * 2.4) * 4;
        path('gull-one', `M150 ${round(288 - flap)} Q161 276 172 288 Q183 276 194 ${round(288 - flap)}`);
        path('gull-two', `M225 ${round(255 + flap * .6)} Q233 248 241 255 Q249 248 257 ${round(255 + flap * .6)}`);
      }

      function tick(now) {
        frameId = null;
        if (!playing || document.hidden) { previous = null; return; }
        if (previous !== null) elapsed += Math.min((now - previous) / 1000, .05) * speed;
        previous = now;
        draw(elapsed);
        frameId = requestAnimationFrame(tick);
      }

      function startClock() {
        if (frameId === null && playing && !document.hidden) {
          previous = null;
          frameId = requestAnimationFrame(tick);
        }
      }

      function updatePlayback(announce = false) {
        byId('toggle-text').textContent = playing ? '暂停' : '播放';
        byId('toggle').setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
        byId('toggle').setAttribute('aria-pressed', String(!playing));
        // Explicit display works consistently for SVG elements in all browsers.
        byId('pause-icon').style.display = playing ? 'block' : 'none';
        byId('play-icon').style.display = playing ? 'none' : 'block';
        if (announce) byId('playback-status').textContent = playing ? '骑行动画已播放' : '骑行动画已暂停';
        if (playing) startClock();
        else if (frameId !== null) { cancelAnimationFrame(frameId); frameId = null; previous = null; }
      }

      byId('toggle').addEventListener('click', () => { playing = !playing; updatePlayback(true); });
      byId('speed').addEventListener('input', event => {
        speed = Number(event.target.value);
        byId('speed-value').textContent = `${speed}×`;
        event.target.setAttribute('aria-valuetext', `${speed} 倍速度`);
      });
      motionPreference.addEventListener('change', event => {
        playing = !event.matches;
        updatePlayback(true);
      });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          if (frameId !== null) cancelAnimationFrame(frameId);
          frameId = null;
          previous = null;
        } else startClock();
      });

      draw(0);
      updatePlayback();
    })();
  </script>
</body>
</html>
